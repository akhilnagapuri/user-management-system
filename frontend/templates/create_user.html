<!DOCTYPE html>
<html>
<head>
    <title>Create User</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header">
            <h3>Create User</h3>
        </div>

        <div class="card-body">

            <form method="post">

                {% csrf_token %}

                <div class="mb-3">
                    <label>Username</label>
                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label>Email</label>
                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label>Mobile Number</label>
                    <input
                        type="text"
                        name="mobile_number"
                        class="form-control"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label>Domain</label>
                    <input
                        type="text"
                        name="domain"
                        class="form-control"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label>Password</label>
                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label>Role</label>

                    <select
                        name="role"
                        class="form-control"
                    >
                        <option value="admin">Admin</option>
                        <option value="manager">Manager</option>
                        <option value="user">User</option>
                    </select>

                </div>

                <button
                    type="submit"
                    class="btn btn-success"
                >
                    Create User
                </button>

                <a
                    href="/dashboard/"
                    class="btn btn-secondary"
                >
                    Back
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
