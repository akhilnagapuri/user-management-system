<!DOCTYPE html>
<html>
<head>
    <title>Edit User</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-warning">

            <h3>
                Edit User
            </h3>

        </div>

        <div class="card-body">

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label">
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        value="{{ user.username }}"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        value="{{ user.email }}"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Mobile Number
                    </label>

                    <input
                        type="text"
                        name="mobile_number"
                        class="form-control"
                        value="{{ user.mobile_number }}"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Domain
                    </label>

                    <input
                        type="text"
                        name="domain"
                        class="form-control"
                        value="{{ user.domain }}"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Role
                    </label>

                    <select
                        name="role"
                        class="form-select"
                    >

                        <option value="admin"
                            {% if user.role == "admin" %}
                            selected
                            {% endif %}
                        >
                            Admin
                        </option>

                        <option value="manager"
                            {% if user.role == "manager" %}
                            selected
                            {% endif %}
                        >
                            Manager
                        </option>

                        <option value="user"
                            {% if user.role == "user" %}
                            selected
                            {% endif %}
                        >
                            User
                        </option>

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        New Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                    >

                    <small class="text-muted">
                        Leave blank to keep current password.
                    </small>

                </div>

                <button
                    type="submit"
                    class="btn btn-success"
                >
                    Update User
                </button>

                <a
                    href="/users/"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
