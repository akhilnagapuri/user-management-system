<!DOCTYPE html>
<html>
<head>

    <title>
        Trash Users
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-danger text-white d-flex justify-content-between">

            <h3>
                Deleted Users
            </h3>

            <a
                href="/users/"
                class="btn btn-light"
            >
                Back To Users
            </a>

        </div>

        <div class="card-body">

            <table class="table table-bordered table-hover">

                <thead class="table-dark">

                    <tr>

                        <th>
                            Username
                        </th>

                        <th>
                            Email
                        </th>

                        <th>
                            Domain
                        </th>

                        <th>
                            Mobile Number
                        </th>

                        <th>
                            Role
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>

                <tbody>

                    {% for user in users %}

                    <tr>

                        <td>
                            {{ user.username }}
                        </td>

                        <td>
                            {{ user.email }}
                        </td>

                        <td>
                            {{ user.domain }}
                        </td>

                        <td>
                            {{ user.mobile_number }}
                        </td>

                        <td>
                            {{ user.role }}
                        </td>

                        <td>

                            <a
    href="/restore-user/{{ user.id }}/"
    class="btn btn-success btn-sm"
    onclick="return confirm('Restore this user?');"
>
    Restore
</a>
                        </td>

                    </tr>

                    {% empty %}

                    <tr>

                        <td
                            colspan="6"
                            class="text-center"
                        >
                            Trash is empty
                        </td>

                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
